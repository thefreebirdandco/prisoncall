<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfers &#x2014; Prisoncall Admin</title>
  <script>if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(sw=>sw.unregister()));</script>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/assets/brand_logos/Prisoncall_Favicon_Circle_Black.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css?v=12">
</head>
<body class="admin-body">

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <a href="/admin/subscribers.html" class="sidebar-logo">
      <img src="/assets/brand_logos/Prisoncall_White.svg" alt="Prisoncall" width="140" height="17" style="height:17px;width:auto;max-width:160px">
    </a>
    <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">&#x2715;</button>
  </div>
  <nav class="sidebar-nav">
    <a href="/admin/subscribers.html" class="sidebar-link" data-page="subscribers">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-5.916-3.516M9 20H4v-2a4 4 0 015.916-3.516M15 7a4 4 0 11-8 0 4 4 0 018 0zm6 3a3 3 0 11-6 0 3 3 0 016 0zM3 10a3 3 0 116 0 3 3 0 01-6 0z"/></svg>
      Subscribers
    </a>
    <a href="/admin/transfers.html" class="sidebar-link" data-page="transfers">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m-4 6H4m0 0l4 4m-4-4l4-4"/></svg>
      Transfers
    </a>
    <a href="/admin/settings.html" class="sidebar-link" data-page="settings" data-super-only>
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      Settings
    </a>
  </nav>
  <div class="sidebar-footer">
    <span class="sidebar-user-email" id="userEmail"></span>
    <button class="sidebar-logout" id="btnLogout">Sign out</button>
  </div>
</aside>

<main class="admin-main">
  <header class="admin-header">
    <button class="hamburger" id="hamburger" aria-label="Open menu">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div style="flex:1;display:flex;align-items:center;gap:12px;min-width:0">
      <h1 style="font-size:16px;font-weight:700;color:var(--color-text);white-space:nowrap">Transfers</h1>
      <span class="page-count-badge" id="countBadge"></span>
    </div>
  </header>

  <div class="page-body">
    <div class="table-wrap">
      <table class="admin-table" id="transfersTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Assigned Mobile</th>
            <th>Requested Prison</th>
            <th>State</th>
            <th>Submitted At</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="transfersBody">
          <tr class="loading-row"><td colspan="6"><span class="spinner"></span>Loading transfers&hellip;</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script type="module">
import { initAdminPage, api, formatMobile, fmtDateTime, esc, showToast } from '/admin/admin-supabase.js';

await initAdminPage();

let pending = [];

async function loadTransfers() {
  try {
    const data = await api('get-transfers');
    pending = (Array.isArray(data) ? data : []).filter(t => t.status === 'PENDING_VOIPLINE');
    renderTable();
  } catch (err) {
    document.getElementById('transfersBody').innerHTML =
      `<tr class="empty-row"><td colspan="6">Failed to load transfers: ${esc(err.message)}</td></tr>`;
  }
}

function renderTable() {
  const badge = document.getElementById('countBadge');
  badge.textContent = `${pending.length} pending transfer${pending.length !== 1 ? 's' : ''}`;

  const tbody = document.getElementById('transfersBody');
  if (!pending.length) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="6">No pending transfers.</td></tr>`;
    return;
  }

  tbody.innerHTML = pending.map(t => {
    const name   = esc(t.subscriptions?.customer_name || t.assigned_mobile || '\u2014');
    const mobile = esc(formatMobile(t.assigned_mobile));
    const prison = esc(t.new_prison_name  || '\u2014');
    const state  = esc(t.new_prison_state || '\u2014');
    const date   = esc(fmtDateTime(t.created_at));
    return `<tr>
      <td class="td-name">${name}</td>
      <td style="white-space:nowrap">${mobile}</td>
      <td>${prison}</td>
      <td>${state}</td>
      <td class="td-muted">${date}</td>
      <td style="white-space:nowrap;text-align:right;padding-right:12px">
        <button class="btn btn--primary btn--sm btn-complete" data-id="${esc(t.id)}" style="margin-right:6px">Mark Completed</button>
        <button class="btn btn--danger btn--sm btn-cancel" data-id="${esc(t.id)}">Mark Cancelled</button>
      </td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('.btn-complete').forEach(btn => {
    btn.addEventListener('click', () => handleAction('complete-transfer', btn.dataset.id, btn));
  });
  tbody.querySelectorAll('.btn-cancel').forEach(btn => {
    btn.addEventListener('click', () => handleAction('cancel-transfer', btn.dataset.id, btn));
  });
}

async function handleAction(action, id, btn) {
  btn.disabled = true;
  try {
    await api(action, { id });
    showToast(action === 'complete-transfer' ? 'Transfer marked completed.' : 'Transfer cancelled.', 'success');
    await loadTransfers();
  } catch (err) {
    showToast(err.message || 'Action failed.', 'error');
    btn.disabled = false;
  }
}

loadTransfers();
</script>
</body>
</html>
