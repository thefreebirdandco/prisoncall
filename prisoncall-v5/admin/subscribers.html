<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscribers — Prisoncall Admin</title>
  <script>if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(sw=>sw.unregister()));</script>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/assets/brand_logos/Prisoncall_Favicon_Circle_Black.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css?v=12">
</head>
<body class="admin-body">

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <a href="/admin/subscribers.html" class="sidebar-logo">
      <img src="/assets/brand_logos/Prisoncall_White.svg" alt="Prisoncall" width="140" height="17" style="height:17px;width:auto;max-width:160px">
    </a>
    <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">✕</button>
  </div>
  <nav class="sidebar-nav">
    <a href="/admin/subscribers.html" class="sidebar-link" data-page="subscribers">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-5.916-3.516M9 20H4v-2a4 4 0 015.916-3.516M15 7a4 4 0 11-8 0 4 4 0 018 0zm6 3a3 3 0 11-6 0 3 3 0 016 0zM3 10a3 3 0 116 0 3 3 0 01-6 0z"/></svg>
      Subscribers
    </a>
    <a href="/admin/transfers.html" class="sidebar-link" data-page="transfers">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m-4 6H4m0 0l4 4m-4-4l4-4"/></svg>
      Transfers
    </a>
    <a href="/admin/settings.html" class="sidebar-link" data-page="settings" data-super-only>
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      Settings
    </a>
  </nav>
  <div class="sidebar-footer">
    <span class="sidebar-user-email" id="userEmail"></span>
    <button class="sidebar-logout" id="btnLogout">Sign out</button>
  </div>
</aside>

<main class="admin-main">
  <header class="admin-header">
    <button class="hamburger" id="hamburger" aria-label="Open menu">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div style="flex:1;display:flex;align-items:center;gap:12px;min-width:0">
      <h1 style="font-size:16px;font-weight:700;color:var(--color-text);white-space:nowrap">Subscribers</h1>
      <span class="page-count-badge" id="countBadge"></span>
    </div>
  </header>

  <div class="filter-bar">
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-status="">All</button>
      <button class="filter-tab" data-status="PENDING">Pending</button>
      <button class="filter-tab" data-status="ACTIVE">Active</button>
      <button class="filter-tab" data-status="PAUSED">Paused</button>
      <button class="filter-tab" data-status="CANCELLED">Cancelled</button>
    </div>
    <select class="filter-select" id="filterSelect" aria-label="Filter by status">
      <option value="">All</option>
      <option value="PENDING">Pending</option>
      <option value="ACTIVE">Active</option>
      <option value="PAUSED">Paused</option>
      <option value="CANCELLED">Cancelled</option>
    </select>
    <div class="search-box" style="margin-left:auto">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/></svg>
      <input type="search" id="searchInput" placeholder="Name, email, mobile, prison…" autocomplete="off">
    </div>
  </div>

  <div class="page-body">
    <div class="table-wrap">
      <table class="admin-table" id="subsTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Customer</th>
            <th>Email</th>
            <th>Mobile</th>
            <th>Prison</th>
            <th>Prisoncall No</th>
            <th>Plan</th>
            <th>Seal ID</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="subsBody">
          <tr class="loading-row"><td colspan="10"><span class="spinner"></span>Loading subscribers…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="m-card-list" id="subsCards"></div>
  </div>
</main>

<script type="module">
import { initAdminPage, api, formatDID, formatMobile, fmtDate, statusPill, statusClass, esc } from '/admin/admin-supabase.js';

await initAdminPage();

// "monthly" → "Monthly" | "half_yearly" → "Half-Yearly"
function formatInterval(val) {
  if (!val) return '—';
  return val.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join('-');
}

let allSubs  = [];
let filtered = [];
let activeStatus = '';
let searchTerm   = '';

async function loadSubs() {
  try {
    allSubs = await api('get-subscribers');
    applyFilters();
  } catch (err) {
    document.getElementById('subsBody').innerHTML =
      `<tr class="empty-row"><td colspan="10">Failed to load subscribers: ${esc(err.message)}</td></tr>`;
  }
}

function applyFilters() {
  const q = searchTerm.toLowerCase().trim();
  filtered = allSubs.filter(s => {
    if (activeStatus && s.status !== activeStatus) return false;
    if (q) {
      const hay = [s.customer_name, s.customer_email, s.customer_mobile, s.prison_name, s.current_did].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  renderTable();
}

function renderTable() {
  const isMobile = window.innerWidth <= 768;
  document.getElementById('countBadge').textContent = `${filtered.length} subscriber${filtered.length !== 1 ? 's' : ''}`;

  if (isMobile) {
    document.querySelector('.table-wrap').style.display = 'none';
    const cardsEl = document.getElementById('subsCards');
    cardsEl.style.display = '';
    renderSubsCards(cardsEl);
    return;
  }

  document.querySelector('.table-wrap').style.display = '';
  document.getElementById('subsCards').style.display = 'none';

  const tbody = document.getElementById('subsBody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr class="empty-row"><td colspan="10">No subscribers found</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(s => {
    const did = s.current_did ? formatDID(s.current_did) : '<span style="color:#6B7280">—</span>';
    return `<tr class="row-clickable" data-id="${esc(s.id)}">
      <td class="td-muted">${fmtDate(s.created_at)}</td>
      <td class="td-name">${esc(s.customer_name || '—')}</td>
      <td class="td-muted">${esc(s.customer_email || '—')}</td>
      <td style="white-space:nowrap">${esc(formatMobile(s.customer_mobile))}</td>
      <td>${esc(s.prison_name || '—')}${s.prison_state ? `, <span style="color:#6B7280">${esc(s.prison_state.toUpperCase())}</span>` : ''}</td>
      <td class="td-mono">${did}</td>
      <td>${formatInterval(s.plan_interval)}</td>
      <td class="td-mono" style="font-size:11px;color:#6B7280">${esc(s.seal_subscription_id || '—')}</td>
      <td>${statusPill(s.status)}</td>
      <td style="color:#6B7280;font-size:18px;text-align:right;padding-right:20px">›</td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('tr[data-id]').forEach(tr => {
    tr.addEventListener('click', () => {
      window.location.href = `/admin/subscriber-detail.html?id=${tr.dataset.id}`;
    });
  });
}

function renderSubsCards(el) {
  if (!filtered.length) {
    el.innerHTML = `<p class="m-card-empty">No subscribers found</p>`;
    return;
  }
  el.innerHTML = filtered.map(s => {
    const did = s.current_did ? formatDID(s.current_did) : null;
    const prison = [s.prison_name, s.prison_state ? s.prison_state.toUpperCase() : ''].filter(Boolean).join(', ') || '—';
    return `
      <div class="m-card" data-id="${esc(s.id)}">
        <div class="m-card-top">
          <div class="m-card-header">
            <span class="m-card-name">${esc(s.customer_name || '—')}</span>
            ${statusPill(s.status)}
          </div>
          <div class="m-card-body">
            <div class="m-card-row">
              <span class="m-card-label">Prison</span>
              <span class="m-card-value">${esc(prison)}</span>
            </div>
            <div class="m-card-row">
              <span class="m-card-label">Mobile</span>
              <span class="m-card-value">${esc(formatMobile(s.customer_mobile))}</span>
            </div>
            ${did ? `<div class="m-card-row">
              <span class="m-card-label">Prisoncall No</span>
              <span class="m-card-value m-card-mono">${esc(did)}</span>
            </div>` : ''}
            <div class="m-card-row">
              <span class="m-card-label">Plan</span>
              <span class="m-card-value">${formatInterval(s.plan_interval)}</span>
            </div>
          </div>
          <div class="m-card-footer">
            <span class="m-card-date">${fmtDate(s.created_at)}</span>
            <span class="m-card-arrow">›</span>
          </div>
        </div>
      </div>`;
  }).join('');

  el.querySelectorAll('.m-card[data-id]').forEach(card => {
    card.addEventListener('click', () => {
      window.location.href = `/admin/subscriber-detail.html?id=${card.dataset.id}`;
    });
  });
}

// Filter tabs (desktop) — keep select in sync
document.getElementById('filterTabs').addEventListener('click', e => {
  const tab = e.target.closest('.filter-tab');
  if (!tab) return;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  activeStatus = tab.dataset.status;
  document.getElementById('filterSelect').value = activeStatus;
  applyFilters();
});

// Filter select (mobile) — keep tabs in sync
document.getElementById('filterSelect').addEventListener('change', e => {
  activeStatus = e.target.value;
  document.querySelectorAll('.filter-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.status === activeStatus);
  });
  applyFilters();
});

// Search
document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value;
  applyFilters();
});

loadSubs();

let _rszTimer;
window.addEventListener('resize', () => {
  clearTimeout(_rszTimer);
  _rszTimer = setTimeout(applyFilters, 150);
});
</script>
</body>
</html>
